# docker-compose.yml
services:
  postgres1:
    image: postgres:16
    container_name: postgres1
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password1
      POSTGRES_DB: shard1
    ports:
      - "5432:5432"
    volumes:
      - postgres1_data:/var/lib/postgresql/data

  postgres2:
    image: postgres:16
    container_name: postgres2
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password2
      POSTGRES_DB: shard2
    ports:
      - "5433:5432"
    volumes:
      - postgres2_data:/var/lib/postgresql/data

  postgres3:
    image: postgres:16
    container_name: postgres3
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password3
      POSTGRES_DB: shard3
    ports:
      - "5434:5432"
    volumes:
      - postgres3_data:/var/lib/postgresql/data

volumes:
  postgres1_data:
  postgres2_data:
  postgres3_data: